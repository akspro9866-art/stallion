name: CI

# The bridge is pure esbuild output — the protocol suite loads dist/Stallion.js
# into a vm sandbox with a mock api, and the mock-bridge suite runs the
# dist/stallion-mock.mjs HTTP server. Neither needs Cavalry or VS Code, so the
# matrix covers both OSes across the supported Node range. The VS Code
# extension-host suite stays out of CI (it needs a downloaded Electron build);
# run it locally with `npm run test:vscode`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      # No live suite exists yet. test:live deliberately fails preflight; do not
      # advertise a self-hosted workflow that merely reruns these mock tests.

  # Manual-only extension-host suite: downloads Electron, so it never runs on
  # push/PR and is not part of the required matrix. Trigger from the Actions tab.
  vscode-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cross-env NODE_ENV=production npm run build
      - run: xvfb-run -a npm run test:vscode
